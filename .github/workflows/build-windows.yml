name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Tests (including offscreen UI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build UI app
        run: python -m PyInstaller --clean --noconfirm --onedir --contents-directory . --windowed --name NetPilot --icon assets\netpilot.ico --add-data "assets;assets" --collect-all proxy --collect-all utils --paths src src\app.py
      - name: Remove foreign ICU files accidentally discovered through PATH
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'dist/NetPilot/icuuc.dll' -ErrorAction SilentlyContinue
          Get-ChildItem 'dist/NetPilot' -Filter 'icudt*.dll' | Remove-Item -Force
      - name: Packaged UI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          NETPILOT_REDUCED_MOTION: '1'
        run: dist\NetPilot\NetPilot.exe --smoke-test
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NetPilot.iss'
      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -LiteralPath 'dist/NetPilot','LICENSE','THIRD_PARTY_NOTICES.txt' -DestinationPath 'dist/NetPilot-0.5.4-rc11-Portable.zip'
      - name: Checksums
        shell: pwsh
        run: |
          $files = @('dist/installer/NetPilot-0.5.4-rc11-Setup.exe', 'dist/NetPilot-0.5.4-rc11-Portable.zip')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Upload Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: NetPilot-0.5.4-RC11-Windows
          path: |
            dist/installer/NetPilot-0.5.4-rc11-Setup.exe
            dist/NetPilot-0.5.4-rc11-Portable.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            ## NetPilot 0.5.4 RC11

            - Compact premium interface with unified vector icons and subtle motion.
            - Automatic Zapret health monitoring and safe strategy selection.
            - Dynamic tray status and smooth minimize/restore behavior.
            - Verified external Zapret discovery, full stop, reversible startup disable and transactional service transfer.
            - Unified Flowseal strategy and Windows service management.
            - Clear Telegram Proxy and WARP controls without duplicate actions.
            - Event journal, Windows notifications and passive system traffic display.
            - Updated Russian and English documentation.
          files: |
            dist/installer/NetPilot-0.5.4-rc11-Setup.exe
            dist/NetPilot-0.5.4-rc11-Portable.zip
            dist/SHA256SUMS.txt
